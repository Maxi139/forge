<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Forge</title>
    <style>
      /* Hintergrund vor dem ersten Paint, passend zu --bg. */
      html { background: #0c0e10; }
      @media (prefers-color-scheme: light) { html:not([data-theme="dark"]) { background: #ecebe7; } }
      html[data-theme="light"] { background: #ecebe7; }
    </style>
    <script>
      // Thema vor dem ersten Paint setzen, damit nichts aufblitzt.
      try {
        var t = localStorage.getItem("forge.theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
