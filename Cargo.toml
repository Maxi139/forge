[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]

# Die einzige Quelle der Version. `node scripts/sync-version.mjs` reicht sie an
# package.json und tauri.conf.json weiter, `--check` prüft sie (CI).
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1" }
thiserror = "2"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
