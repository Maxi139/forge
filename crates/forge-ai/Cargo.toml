[package]
name = "forge-ai"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
forge-core = { path = "../forge-core" }
forge-analysis = { path = "../forge-analysis" }
forge-secrets = { path = "../forge-secrets" }
serde = { workspace = true }
serde_json = "1"
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }

[dev-dependencies]
tempfile = "3"
