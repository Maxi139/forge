[package]
name = "forge-secrets"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
forge-core = { path = "../forge-core" }
crc32fast = "1"
regex = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"
