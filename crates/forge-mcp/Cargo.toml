[package]
name = "forge-mcp"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "forge_mcp"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "sync", "macros", "time"] }
rand = "0.8"

[dev-dependencies]
tempfile = "3"
