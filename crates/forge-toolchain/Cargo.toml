[package]
name = "forge-toolchain"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
forge-core = { path = "../forge-core" }
forge-analysis = { path = "../forge-analysis" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros", "fs"] }
tokio-util = "0.7"
shlex = "1"

[dev-dependencies]
tempfile = "3"
