[package]
name = "forge-toolchain"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
forge-core = { path = "../forge-core" }
forge-analysis = { path = "../forge-analysis" }
serde = { workspace = true }
serde_json = "1"
sha2 = { workspace = true }
regex = "1"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros", "fs"] }
tokio-util = "0.7"
shlex = "1"

[dev-dependencies]
tempfile = "3"
